name: data-audit

# Read-only audit of the live database (recon/data_audit.js): field fill rates,
# provenance, freshness, links, enrichment, contacts, duplicates and sync
# reliability per market. The baseline for the data-quality scorecard in
# docs/DATA_ENGINE_PLAN.md. Every connection is set read-only.
on:
  workflow_dispatch:
  pull_request:
    paths:
      - recon/data_audit.js
      - .github/workflows/data-audit.yml

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci --ignore-scripts
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
      - name: Audit
        run: |
          if [ -z "$DATABASE_URL" ]; then echo "::warning::DATABASE_URL is not available (fork PR?); skipped"; exit 0; fi
          set -o pipefail
          node recon/data_audit.js | tee -a "$GITHUB_STEP_SUMMARY"
