name: engine-verify

# Read-only verification of the data-engine hardening against the live database
# (recon/engine_verify.js). Runs on demand, and on a PR that changes the script
# or a migration.
on:
  workflow_dispatch:
  pull_request:
    paths:
      - recon/engine_verify.js
      - .github/workflows/engine-verify.yml
      - db/migrations/**

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci --ignore-scripts
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
      - name: Check
        run: |
          if [ -z "$DATABASE_URL" ]; then echo "::warning::DATABASE_URL is not available (fork PR?); skipped"; exit 0; fi
          set -o pipefail
          node recon/engine_verify.js | tee -a "$GITHUB_STEP_SUMMARY"
