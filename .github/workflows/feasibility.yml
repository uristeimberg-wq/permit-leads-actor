name: feasibility

# Manual only: runs the M1 data-feasibility measurements against the live
# Austin and Miami-Dade sources (read-only, rate-limited) and publishes the
# report as the job summary and an artifact. See recon/feasibility.js.
on:
  workflow_dispatch:
    inputs:
      months:
        description: Months of history to analyse
        default: '18'
      only:
        description: Comma-separated sections (austin, austinUpdatedAt, austinWindows, miamiWindow, miami); empty runs all
        default: ''

jobs:
  measure:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      # Inputs go through env, not inline, so they can't inject shell.
      - run: node recon/feasibility.js --out=feasibility-report --months="$MONTHS" ${ONLY:+--only="$ONLY"}
        env:
          MONTHS: ${{ inputs.months }}
          ONLY: ${{ inputs.only }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: feasibility-report
          path: feasibility-report/
