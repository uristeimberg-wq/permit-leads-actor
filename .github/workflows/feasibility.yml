name: feasibility

# Manual only: runs the M1 data-feasibility measurements against the live
# Austin and Miami-Dade sources (read-only, rate-limited) and publishes the
# report as the job summary and an artifact. See recon/feasibility.js and
# recon/plan_review.js (building-permit review time and sub-hiring signals).
on:
  workflow_dispatch:
    inputs:
      months:
        description: Months of history to analyse
        default: '18'
      only:
        description: Comma-separated sections (austin, austinUpdatedAt, austinWindows, miamiWindow, miami); empty runs all; 'enrichment' runs recon/enrichment_sources.js only
        default: ''
      markets:
        description: "Market scan (recon/market_scan.js) instead of the measurements: 'all' for discovery plus probes, or a comma-separated --only list"
        default: ''
      market_cities:
        description: "Market scan: comma-separated city names to search on ArcGIS and Socrata"
        default: ''
      market_links:
        description: "Market scan: building-to-trade link rates (recon/market_links.js): 'all' or a comma-separated source list"
        default: ''
      market_ckan:
        description: "Market scan: comma-separated CKAN portals to list permit datasets from"
        default: ''
      descriptions:
        description: "Names in Austin descriptions (recon/description_names.js): months of history; runs only this"
        default: ''

jobs:
  measure:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      # Plan-review timing and GC-sub stickiness (recon/plan_review.js); skipped
      # when only specific feasibility sections are requested.
      - if: inputs.markets != ''
        run: node recon/market_scan.js --out=feasibility-report/markets ${MARKETS:+--only="$MARKETS"} ${CITIES:+--cities="$CITIES"} ${CKAN:+--ckan="$CKAN"}
        env:
          MARKETS: ${{ inputs.markets != 'all' && inputs.markets || '' }}
          CITIES: ${{ inputs.market_cities }}
          CKAN: ${{ inputs.market_ckan }}
      - if: inputs.descriptions != ''
        run: node recon/description_names.js --out=feasibility-report/description-names --months="$MONTHS"
        env:
          MONTHS: ${{ inputs.descriptions }}
      - if: inputs.market_links != ''
        run: node recon/market_links.js --out=feasibility-report/links ${LINKS:+--only="$LINKS"}
        env:
          LINKS: ${{ inputs.market_links != 'all' && inputs.market_links || '' }}
      - if: inputs.only == '' && inputs.markets == '' && inputs.market_links == '' && inputs.descriptions == ''
        run: node recon/plan_review.js --out=feasibility-report/plan-review --months=24
      # Inputs go through env, not inline, so they can't inject shell.
      - if: always() && inputs.only != 'enrichment' && inputs.markets == '' && inputs.market_links == '' && inputs.descriptions == ''
        run: node recon/feasibility.js --out=feasibility-report --months="$MONTHS" ${ONLY:+--only="$ONLY"}
        env:
          MONTHS: ${{ inputs.months }}
          ONLY: ${{ inputs.only }}
      # Enrichment-source recon (licences, appraisal, geocoding); prints to the log.
      - if: inputs.only == 'enrichment'
        timeout-minutes: 15
        run: node recon/enrichment_sources.js
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: feasibility-report
          path: feasibility-report/
