name: feasibility

# Manual only: runs the M1 data-feasibility measurements against the live
# Austin and Miami-Dade sources (read-only, rate-limited) and publishes the
# report as the job summary and an artifact. See recon/feasibility.js and
# recon/plan_review.js (building-permit review time and sub-hiring signals).
on:
  workflow_dispatch:
    inputs:
      months:
        description: Months of history to analyse
        default: '18'
      only:
        description: Comma-separated sections (austin, austinUpdatedAt, austinWindows, miamiWindow, miami, raleighWindows); empty runs all; 'enrichment' runs recon/enrichment_sources.js only ('enrichment:tcadLayout' for named sections)
        default: ''
      markets:
        description: "Market scan (recon/market_scan.js) instead of the measurements: 'all' for discovery plus probes, or a comma-separated --only list"
        default: ''
      market_cities:
        description: "Market scan: comma-separated city names to search on ArcGIS and Socrata"
        default: ''
      market_links:
        description: "Market scan: building-to-trade link rates (recon/market_links.js): 'all' or a comma-separated source list"
        default: ''
      market_terms:
        description: "Market scan: print licence/terms metadata (recon/market_terms.js) for a comma-separated --only list"
        default: ''
      market_ckan:
        description: "Market scan: comma-separated CKAN portals to list permit datasets from"
        default: ''
      tcad:
        description: "Travis CAD terms, export layout and Texas statutes (recon/tcad_terms.js): 'yes' runs only this"
        default: ''
      preapproval:
        description: "Pre-approval scan (recon/preapproval_scan.js): 'all', or a comma list of seeds,discover,legistar,portals; runs only this"
        default: ''
      preapproval_specs:
        description: "Pre-approval scan with preapproval=specs: comma list of socrata:domain/id#groupCol|groupCol2 or arcgis:<layer url>#col"
        default: ''
      descriptions:
        description: "Names in Austin descriptions (recon/description_names.js): months of history; runs only this"
        default: ''
      backtest:
        description: "Early-signal backtest (recon/early_backtest.js, DATA_STRATEGY P0): 'yes' runs only this"
        default: ''
      planning:
        description: "Planning-source probe (recon/planning_probe.js): 'all' or a comma list of raleigh-devplans,raleigh-plan-areas,austin-site-plans,austin-subdivisions,miami-derm-sewer,miami-derm-lead,miami-wasd-allocation, or 'checks[:austin-site,austin-subdiv,derm-dupes,derm-codes,derm-lead,raleigh]' for the link hand checks; runs only this"
        default: ''
      discover:
        description: "Discovery scan (recon/discovery_scan.js): 'all', a comma list of orgs,search,socrata,layers, or 'specs:<url|socrata:domain/id>,...'; runs only this"
        default: ''

jobs:
  measure:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      # Plan-review timing and GC-sub stickiness (recon/plan_review.js); skipped
      # when only specific feasibility sections are requested.
      - if: inputs.markets != ''
        run: node recon/market_scan.js --out=feasibility-report/markets ${MARKETS:+--only="$MARKETS"} ${CITIES:+--cities="$CITIES"} ${CKAN:+--ckan="$CKAN"}
        env:
          MARKETS: ${{ inputs.markets != 'all' && inputs.markets || '' }}
          CITIES: ${{ inputs.market_cities }}
          CKAN: ${{ inputs.market_ckan }}
      - if: inputs.tcad != ''
        run: |
          node recon/tcad_terms.js --out=feasibility-report/tcad
          if [ -f feasibility-report/tcad/layout.zip ]; then
            cd feasibility-report/tcad && unzip -o -q layout.zip -d layout && find layout -type f | head -50
            # Field names that concern owners or confidentiality (layout only, no records).
            for f in $(find layout -type f); do
              case "$f" in
                *.xlsx) unzip -p "$f" xl/sharedStrings.xml | sed 's/<[^>]*>/\n/g' ;;
                *.pdf) strings "$f" ;;
                *) cat "$f" ;;
              esac
            done | grep -iE 'owner|confiden|addr|mail|exempt|deed|sale|homestead' | sort -u | head -120
          fi
      - if: inputs.preapproval != ''
        # preapproval_specs: "<specs>" or "<specs>;;<arcgis query>;<arcgis query>"
        run: |
          SP="${SPECS%%;;*}"; [ -n "$SOQL" ] && SP=""; AQ=""; case "$SPECS" in *';;'*) AQ="${SPECS#*;;}";; esac
          node recon/preapproval_scan.js --out=feasibility-report/preapproval ${ONLY:+--only="$ONLY"} ${SP:+--cols --specs="$SP"} ${AQ:+--arcsearch="$AQ"} ${SOQL:+--soql="$SOQL"} ${LINK:+--austinlink}
        env:
          SPECS: ${{ inputs.preapproval_specs }}
          SOQL: ${{ startsWith(inputs.preapproval, 'soql:') && inputs.preapproval_specs || '' }}
          LINK: ${{ inputs.preapproval == 'soql:link' && 'yes' || '' }}
          ONLY: ${{ inputs.preapproval != 'all' && inputs.preapproval != 'specs' && !startsWith(inputs.preapproval, 'soql:') && inputs.preapproval || ((inputs.preapproval == 'specs' || startsWith(inputs.preapproval, 'soql:')) && 'none' || '') }}
      - if: inputs.backtest != ''
        timeout-minutes: 25
        run: node recon/early_backtest.js --out=feasibility-report/early-backtest
      - if: inputs.planning != ''
        # 'checks' or 'checks:<list>' runs the link hand checks (recon/planning_checks.js).
        run: |
          case "$PLANNING" in
            checks) node recon/planning_checks.js --pad ;;
            checks:*) node recon/planning_checks.js --only="${PLANNING#checks:}" --pad ;;
            *) node recon/planning_probe.js --only="$PLANNING" --pad ;;
          esac
        env:
          PLANNING: ${{ inputs.planning }}
      - if: inputs.discover != ''
        run: |
          case "$DISCOVER" in
            all) node recon/discovery_scan.js --pad ;;
            checks) node recon/discovery_checks.js --pad ;;
            checks:*) node recon/discovery_checks.js --only="${DISCOVER#checks:}" --pad ;;
            specs:*) node recon/discovery_scan.js --specs="${DISCOVER#specs:}" --pad ;;
            *) node recon/discovery_scan.js --only="$DISCOVER" --pad ;;
          esac
        env:
          DISCOVER: ${{ inputs.discover }}
      - if: inputs.descriptions != ''
        run: node recon/description_names.js --out=feasibility-report/description-names --months="$MONTHS"
        env:
          MONTHS: ${{ inputs.descriptions }}
      - if: inputs.market_links != ''
        run: node recon/market_links.js --out=feasibility-report/links ${LINKS:+--only="$LINKS"}
        env:
          LINKS: ${{ inputs.market_links != 'all' && inputs.market_links || '' }}
      - if: inputs.market_terms != ''
        run: node recon/market_terms.js --only="$TERMS"
        env:
          TERMS: ${{ inputs.market_terms }}
      - if: inputs.only == '' && inputs.markets == '' && inputs.market_links == '' && inputs.market_terms == '' && inputs.descriptions == '' && inputs.tcad == '' && inputs.preapproval == '' && inputs.backtest == '' && inputs.planning == '' && inputs.discover == ''
        run: node recon/plan_review.js --out=feasibility-report/plan-review --months=24
      # Inputs go through env, not inline, so they can't inject shell.
      - if: always() && !startsWith(inputs.only, 'enrichment') && inputs.markets == '' && inputs.market_links == '' && inputs.market_terms == '' && inputs.descriptions == '' && inputs.tcad == '' && inputs.preapproval == '' && inputs.backtest == '' && inputs.planning == '' && inputs.discover == ''
        run: node recon/feasibility.js --out=feasibility-report --months="$MONTHS" ${ONLY:+--only="$ONLY"}
        env:
          MONTHS: ${{ inputs.months }}
          ONLY: ${{ inputs.only }}
      # Enrichment-source recon (licences, appraisal, geocoding); prints to the log.
      # 'enrichment' runs every section; 'enrichment:tcadLayout,census' runs those.
      - if: startsWith(inputs.only, 'enrichment')
        timeout-minutes: 15
        env:
          SECTIONS: ${{ inputs.only }}
          # Only the comptroller section reads it; the key is never printed.
          TX_COMPTROLLER_API_KEY: ${{ secrets.TX_COMPTROLLER_API_KEY }}
        run: |
          if [ "$SECTIONS" = enrichment ]; then node recon/enrichment_sources.js; else node recon/enrichment_sources.js --only="${SECTIONS#enrichment:}"; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: feasibility-report
          path: feasibility-report/
