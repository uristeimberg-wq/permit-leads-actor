name: filer-check

# Manual only: spot-check of the "Builder" tag on Austin applications
# (recon/filer_spotcheck.js, ADR-19). Reads the database (SELECT only) and
# re-reads a sample from the city's open data. Writes nothing.
on:
  workflow_dispatch:
    inputs:
      n:
        description: Applications to re-read live (half per basis)
        default: '20'
      seed:
        description: Sample seed (change it for a fresh sample)
        default: 'filers-check-1'

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci --ignore-scripts
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
      - name: Spot-check
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          N: ${{ inputs.n }}
          SEED: ${{ inputs.seed }}
        run: |
          [[ "$N" =~ ^[0-9]{1,3}$ ]] || { echo "::error::n must be a number"; exit 1; }
          [[ "$SEED" =~ ^[A-Za-z0-9_-]{1,40}$ ]] || { echo "::error::bad seed"; exit 1; }
          set -o pipefail; node recon/filer_spotcheck.js --n="$N" --seed="$SEED" | tee -a "$GITHUB_STEP_SUMMARY"
