name: insights-check

# Read-only check of the ADR-21 estimates against the live database: how many
# filings get an estimate and whether the ranges hold on permits whose outcome
# is known. Every connection is set read-only (recon/insights_check.js).
on:
  workflow_dispatch:
  pull_request:
    paths:
      - recon/insights_check.js
      - src/forecast.js
      - db/insight_queries.js

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci --ignore-scripts
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
      - name: Check the estimates
        run: |
          if [ -z "$DATABASE_URL" ]; then echo "::warning::DATABASE_URL is not available (fork PR?); skipped"; exit 0; fi
          set -o pipefail
          node recon/insights_check.js | tee -a "$GITHUB_STEP_SUMMARY"
