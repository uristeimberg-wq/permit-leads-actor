name: smoke

# Post-deploy check of the hosted demo (ADR-13): it is up, the password gate
# holds (sign-in page for browsers, 401 for the API), and with the
# DEMO_PASSWORD secret it signs in and serves real pilot data.
# Prints counts only, never names or phones. The layout job checks every
# screen at phone and tablet widths (test/layout/check.js).
on:
  workflow_dispatch:
    inputs:
      url:
        description: Base URL of the deployment, e.g. https://permits-production-xxxx.up.railway.app
        type: string
        required: true

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      BASE: ${{ inputs.url }}
      DEMO_PASSWORD: ${{ secrets.DEMO_PASSWORD }}
    steps:
      - name: Check
        run: |
          set -u
          [[ "$BASE" =~ ^https://[a-z0-9.-]+$ ]] || { echo "::error::url must be https://host with no path"; exit 1; }
          code() { curl -s -o /dev/null -w '%{http_code}' --max-time 30 "$@"; }
          fail=0
          h=$(code "$BASE/healthz"); echo "healthz: $h"; [ "$h" = 200 ] || fail=1
          for p in / /pilot/live/ /pilot/live/early.html /pilot/live/gcs.html; do
            c=$(code -H 'accept: text/html' "$BASE$p"); echo "no session $p: $c (want 302 to /login)"; [ "$c" = 302 ] || fail=1
          done
          c=$(code "$BASE/login"); echo "sign-in page: $c (want 200)"; [ "$c" = 200 ] || fail=1
          c=$(code "$BASE/api/pilot/meta"); echo "no session API: $c (want 401)"; [ "$c" = 401 ] || fail=1
          c=$(code -u "x:wrong-password" "$BASE/api/pilot/meta"); echo "wrong password: $c (want 401)"; [ "$c" = 401 ] || fail=1
          c=$(code -X POST --data-urlencode "password=wrong-password" "$BASE/login"); echo "wrong sign-in: $c (want 401)"; [ "$c" = 401 ] || fail=1
          if [ -n "$DEMO_PASSWORD" ]; then
            jar=$(mktemp)
            c=$(code -c "$jar" -X POST --data-urlencode "password=$DEMO_PASSWORD" --data-urlencode "next=/pilot/live/" "$BASE/login")
            echo "sign-in: $c (want 303)"; [ "$c" = 303 ] || fail=1
            for p in "/pilot/live/" "/pilot/live/early.html" "/pilot/live/momentum.html" "/pilot/live/gcs.html" "/pilot/live/digest.html" "/search.html"; do
              c=$(code -b "$jar" "$BASE$p"); echo "page $p: $c"; [ "$c" = 200 ] || fail=1
            done
            curl -s --max-time 90 -b "$jar" "$BASE/api/pilot/overview?source=austin-tx" \
              | jq -c '{buildingRecent: .totals.buildingRecent, activeGcs: .totals.activeGcs, weeks: (.weekly|length),
                        topGcs: (.topGcs|length), recent: (.recent|length), pins: (.map.pins|length), unplaced: .map.unplaced}' || fail=1
            rm -f "$jar"
            curl -s --max-time 60 -u "x:$DEMO_PASSWORD" "$BASE/api/pilot/meta" \
              | jq -c '{lastSyncAt, lastSyncStatus, historyFrom, historyTo}' || fail=1
            curl -s --max-time 60 -u "x:$DEMO_PASSWORD" "$BASE/api/pilot/gcs?source=austin-tx&trade=electrical&months=12" \
              | jq -c '{gcs: (.gcs|length), jobs: .baseline.jobs, linkedJobs: .baseline.linkedJobs, repeatRate: .baseline.repeatRate,
                        withShownPhone: ([.gcs[]|select(.gc.phone)]|length), withheld: ([.gcs[]|select(.gc.name==null)]|length)}' || fail=1
            curl -s --max-time 60 -u "x:$DEMO_PASSWORD" "$BASE/api/pilot/leads?trade=electrical&days=7" | jq -c '{leads: (.leads|length)}' || fail=1
            # Every pilot market, and the Early filings screen where a market has one.
            for src in austin-tx miami-dade-fl miami-city-fl raleigh-nc; do
              curl -s --max-time 60 -u "x:$DEMO_PASSWORD" "$BASE/api/pilot/gcs?source=$src&trade=electrical&months=12" \
                | jq -ec --arg s "$src" 'select(.filters.source == $s) | {source: $s, gcs: (.gcs|length), jobs: .baseline.jobs, lastSyncAt: .meta.lastSyncAt}' || fail=1
              curl -s --max-time 60 -u "x:$DEMO_PASSWORD" "$BASE/api/pilot/early?source=$src&days=30" \
                | jq -ec --arg s "$src" 'select(.filters.source == $s) | {source: $s, early: .available, filings: (.filings|length), stages: .counts}' || fail=1
            done
          else
            echo "::notice::DEMO_PASSWORD secret not set: checked the gate only, not the data."
          fi
          exit $fail

  # The same phone and tablet check as CI, against the deployment's real data.
  layout:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      BASE: ${{ inputs.url }}
      DEMO_PASSWORD: ${{ secrets.DEMO_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci --ignore-scripts
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
      - run: npx playwright install --with-deps chromium
      - name: Phones and tablets
        run: |
          [[ "$BASE" =~ ^https://[a-z0-9.-]+$ ]] || { echo "::error::url must be https://host with no path"; exit 1; }
          if [ -z "$DEMO_PASSWORD" ]; then echo "::notice::DEMO_PASSWORD not set: layout check skipped."; exit 0; fi
          OUT=layout-shots node test/layout/check.js "$BASE"
      # Screenshots of the live demo show company names and phones from
      # permits, so they are kept for one day only.
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: layout-shots-live
          path: layout-shots/
          retention-days: 1
          if-no-files-found: ignore
