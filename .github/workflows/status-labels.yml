name: status-labels

# Read-only: records whose status label contradicts their source status, old
# labels against web/public/stages.js, plus one reported record checked against
# the live source (recon/status_labels.js).
on:
  workflow_dispatch:
  pull_request:
    paths:
      - recon/status_labels.js
      - .github/workflows/status-labels.yml
      - web/public/stages.js

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci --ignore-scripts
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
      - name: Check
        run: |
          if [ -z "$DATABASE_URL" ]; then echo "::warning::DATABASE_URL is not available (fork PR?); skipped"; exit 0; fi
          set -o pipefail
          node recon/status_labels.js | tee -a "$GITHUB_STEP_SUMMARY"
