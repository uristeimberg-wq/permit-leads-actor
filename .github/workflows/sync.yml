name: sync

# Daily pilot sync (ADR-7): Austin and Miami-Dade into the hosted Postgres in
# the DATABASE_URL secret. Every attempt is recorded in sync_runs; --strict
# fails this job when any area fails, so GitHub notifies the repo owner.
on:
  schedule:
    # Austin finishes its daily reload around 15:30 UTC (measured 2026-11-13).
    - cron: '15 17 * * *'
  workflow_dispatch:
    inputs:
      ephemeral:
        description: Dry run against a throwaway Postgres in the job instead of DATABASE_URL
        type: boolean
        default: false
      backfill_days:
        description: Backfill instead of the daily windows, e.g. 180. Blank = normal daily sync
        type: string
        default: ''
      backfill_area:
        description: Area to backfill (austin-tx, austin-plan-review-tx, miami-dade-fl, miami-city-fl, raleigh-nc, or a planning source such as austin-site-plans-tx)
        type: string
        default: austin-tx
      rescore:
        description: Re-score every stored permit with the current trade rules (after a rule change)
        type: boolean
        default: false

concurrency:
  group: sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    # Only used by an ephemeral dry run; cheap to start otherwise.
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: permits
          POSTGRES_PASSWORD: permits
          POSTGRES_DB: permits
        ports: ['5433:5432']
        options: >-
          --health-cmd "pg_isready -U permits" --health-interval 5s
          --health-timeout 5s --health-retries 10
    env:
      DB_URL: ${{ inputs.ephemeral && 'postgres://permits:permits@localhost:5433/permits' || secrets.DATABASE_URL }}
    steps:
      - name: Check the database secret
        id: secret
        run: |
          if [ -z "$DB_URL" ]; then
            echo "::warning::DATABASE_URL secret is not set; no sync ran. Add it under Settings > Secrets and variables > Actions."
            echo "No sync ran: the DATABASE_URL secret is not set." >> "$GITHUB_STEP_SUMMARY"
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.secret.outputs.ready == 'true'
      - uses: actions/setup-node@v4
        if: steps.secret.outputs.ready == 'true'
        with:
          node-version: 20
          cache: npm
      - run: npm ci --ignore-scripts
        if: steps.secret.outputs.ready == 'true'
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
      # Applies pending migrations, then syncs the pilot areas. A failed run is
      # retried once after 10 minutes (every write is an upsert, so a re-run is
      # safe); both attempts are recorded in sync_runs (ADR-14).
      - name: Sync
        if: steps.secret.outputs.ready == 'true' && !inputs.backfill_days
        env:
          DATABASE_URL: ${{ env.DB_URL }}
          SOCRATA_APP_TOKEN: ${{ secrets.SOCRATA_APP_TOKEN }}
        run: |
          for attempt in 1 2; do
            node ingest/run.js --strict --kind=scheduled && exit 0
            if [ "$attempt" = 1 ]; then echo "::warning::Sync attempt 1 failed; retrying in 10 minutes"; sleep 600; fi
          done
          exit 1
      # Rolling re-read (migration 030): each source's least recently
      # confirmed stored permits, re-fetched by number, so status changes and
      # deletions outside the date windows reach us. Marks, never deletes.
      - name: Re-read older permits
        if: always() && steps.secret.outputs.ready == 'true' && !inputs.backfill_days
        timeout-minutes: 30
        env:
          DATABASE_URL: ${{ env.DB_URL }}
          SOCRATA_APP_TOKEN: ${{ secrets.SOCRATA_APP_TOKEN }}
        run: set -o pipefail; node ingest/refresh.js | tee -a "$GITHUB_STEP_SUMMARY"
      # One-off history pull for the GC relationships view. Inputs go through
      # env and are validated, never interpolated into the shell.
      - name: Backfill
        if: steps.secret.outputs.ready == 'true' && inputs.backfill_days
        env:
          DATABASE_URL: ${{ env.DB_URL }}
          SOCRATA_APP_TOKEN: ${{ secrets.SOCRATA_APP_TOKEN }}
          DAYS: ${{ inputs.backfill_days }}
          AREA: ${{ inputs.backfill_area }}
        run: |
          [[ "$DAYS" =~ ^[0-9]{1,4}$ ]] || { echo "::error::backfill_days must be a number"; exit 1; }
          [[ "$AREA" =~ ^(austin-tx|austin-plan-review-tx|miami-dade-fl|miami-city-fl|raleigh-nc|austin-site-plans-tx|austin-subdivisions-tx|raleigh-plan-areas-nc|raleigh-devplans-nc|miami-derm-sewer-fl|miami-city-trees-fl|miami-dade-zoning-hearings-fl|miami-dade-inspections-fl|raleigh-inspections-nc)$ ]] || { echo "::error::unknown backfill_area"; exit 1; }
          node ingest/run.js --strict --kind=backfill --area="$AREA" --days="$DAYS"
      # Contractors, contact points and GC -> sub links, rebuilt from the
      # latest raw records (ADR-12). Runs even if one area failed, on what we have.
      - name: Resolve contractors
        if: always() && steps.secret.outputs.ready == 'true'
        env:
          DATABASE_URL: ${{ env.DB_URL }}
        run: node ingest/resolve.js
      # Lifecycle stages from the reviewed vocabularies, official dates, and the
      # Austin plan-review -> building-permit links (ADR-16). After the sync,
      # on what we have; prints unmapped statuses and the link rate.
      - name: Lifecycle and links
        if: always() && steps.secret.outputs.ready == 'true'
        env:
          DATABASE_URL: ${{ env.DB_URL }}
        run: set -o pipefail; node ingest/lifecycle.js | tee -a "$GITHUB_STEP_SUMMARY"
      # Planning cases (site plans, subdivisions, development plans; migration
      # 025): links to the permits they led to, rebuilt from raw records, and
      # a report of stages and unmapped statuses (rule 3).
      - name: Planning cases and links
        if: always() && steps.secret.outputs.ready == 'true'
        env:
          DATABASE_URL: ${{ env.DB_URL }}
        run: set -o pipefail; node ingest/planning.js | tee -a "$GITHUB_STEP_SUMMARY"
      # Inspections (migration 033): permit links from the source's own permit
      # number and house number, and a report of result classes, unmapped
      # wordings (rule 3) and result changes recorded.
      - name: Inspections and links
        if: always() && steps.secret.outputs.ready == 'true'
        env:
          DATABASE_URL: ${{ env.DB_URL }}
        run: set -o pipefail; node ingest/inspections.js | tee -a "$GITHUB_STEP_SUMMARY"
      # Building facts the sources publish but permits never mapped (units,
      # floors, square feet, class, zoning, plan-review days, official record
      # link), from each permit's latest raw record (ADR-23, migration 020).
      # Incremental: only permits whose raw record changed are rewritten.
      - name: Building facts
        if: always() && steps.secret.outputs.ready == 'true'
        env:
          DATABASE_URL: ${{ env.DB_URL }}
        run: set -o pipefail; node ingest/facts.js | tee -a "$GITHUB_STEP_SUMMARY"
      # Who filed each Austin application, builder or permit expediter, from
      # the two organisation fields and the linked building permits (ADR-19).
      # After resolve and lifecycle: it reads contractors and permit_links.
      - name: Filers
        if: always() && steps.secret.outputs.ready == 'true'
        env:
          DATABASE_URL: ${{ env.DB_URL }}
        run: set -o pipefail; node ingest/filers.js | tee -a "$GITHUB_STEP_SUMMARY"
      # Property facts for permits whose source publishes a parcel id (ADR-14
      # step 3). After the sync so new permits are covered; runs even if one
      # area failed. Its own sync_runs row makes a failure visible to health.
      - name: Enrich parcels
        if: always() && steps.secret.outputs.ready == 'true'
        env:
          DATABASE_URL: ${{ env.DB_URL }}
        run: set -o pipefail; node ingest/enrich_parcels.js | tee -a "$GITHUB_STEP_SUMMARY"
      # Wake County parcels for Raleigh (ADR-23 sprint 1), joined on the permit's pin.
      - name: Enrich Wake parcels
        if: always() && steps.secret.outputs.ready == 'true'
        env:
          DATABASE_URL: ${{ env.DB_URL }}
        run: set -o pipefail; node ingest/enrich_parcels.js --provider=wake-parcels | tee -a "$GITHUB_STEP_SUMMARY"
      # Austin parcel centroids (City of Austin copy of the Travis CAD
      # polygons), by the permit's tcad_id, so Locate permits can place the
      # Austin permits the Census misses. Point only, no property facts.
      # Released 2026-11-14 with the other holds (src/holds.js).
      - name: Austin parcel points
        if: always() && steps.secret.outputs.ready == 'true'
        env:
          DATABASE_URL: ${{ env.DB_URL }}
        run: set -o pipefail; node ingest/enrich_parcels.js --provider=austin-parcels | tee -a "$GITHUB_STEP_SUMMARY"
      # Travis CAD property facts for Austin (ADR-15 step 3b; use rules in
      # docs/COMPLIANCE.md). Downloads a ~510 MB zip and streams it.
      - name: Enrich Travis CAD
        if: always() && steps.secret.outputs.ready == 'true'
        timeout-minutes: 30
        env:
          DATABASE_URL: ${{ env.DB_URL }}
        run: set -o pipefail; node ingest/enrich_tcad.js | tee -a "$GITHUB_STEP_SUMMARY"
      # Field-level provenance (ADR-23, migration 023): property observations
      # from appraiser parcels and the permits filed on them; disagreements
      # become field_conflicts rows. After parcels and building facts.
      - name: Field observations
        if: always() && steps.secret.outputs.ready == 'true'
        env:
          DATABASE_URL: ${{ env.DB_URL }}
        run: set -o pipefail; node ingest/fields.js | tee -a "$GITHUB_STEP_SUMMARY"
      # Permit locations (ADR-15 item 4): source point, then parcel point, then
      # the Census geocoder on job-site addresses only. Runs after parcels.
      - name: Locate permits
        if: always() && steps.secret.outputs.ready == 'true'
        env:
          DATABASE_URL: ${{ env.DB_URL }}
        run: set -o pipefail; node ingest/geocode.js | tee -a "$GITHUB_STEP_SUMMARY"
      # State licence registries (ADR-15 item 1): verifies contractors after
      # Resolve has rebuilt them. Each provider records its own sync run.
      # Texas business registrations (ADR-23 sprint 2): contractor businesses
      # against the Comptroller's franchise-tax records. Rate-limited API, so
      # each run works through at most 600 names or 20 minutes of the backlog.
      - name: Texas business registrations
        if: always() && steps.secret.outputs.ready == 'true'
        timeout-minutes: 25
        env:
          DATABASE_URL: ${{ env.DB_URL }}
          TX_COMPTROLLER_API_KEY: ${{ secrets.TX_COMPTROLLER_API_KEY }}
        run: set -o pipefail; node ingest/enrich_registrations.js | tee -a "$GITHUB_STEP_SUMMARY"
      # Florida business entities (lane C, migration 027): the Division of
      # Corporations' free SFTP files. Daily files each day; the 1.8 GB
      # quarterly file when it changes or weekly (ingest/enrich_sunbiz.js).
      # Its matches feed tomorrow's Resolve (contractors-v5 rule 3).
      # curl's SFTP needs the host key in known_hosts (curl exit 60 without
      # it): ingest/sunbiz_known_hosts.sh adds only keys matching pinned
      # fingerprints; verification is never turned off.
      # The step is non-fatal to the sync: a failure is still recorded as a
      # failed fl-sunbiz attempt (rule 3), but the job does not turn red for it.
      - name: Florida business entities (Sunbiz)
        if: always() && steps.secret.outputs.ready == 'true'
        continue-on-error: true
        timeout-minutes: 50
        env:
          DATABASE_URL: ${{ env.DB_URL }}
        run: |
          set -o pipefail
          bash ingest/sunbiz_known_hosts.sh
          node ingest/enrich_sunbiz.js | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Verify licences
        if: always() && steps.secret.outputs.ready == 'true'
        env:
          DATABASE_URL: ${{ env.DB_URL }}
          SOCRATA_APP_TOKEN: ${{ secrets.SOCRATA_APP_TOKEN }}
        run: set -o pipefail; node ingest/enrich_licences.js | tee -a "$GITHUB_STEP_SUMMARY"
      # Customer email digests (ADR-20), last, so the email reads the same data
      # as the screens. A dry run (renders to digest-preview/, sends nothing)
      # until the repo variables EMAIL_PROVIDER and EMAIL_SEND_ENABLED=yes and
      # the other settings in docs/EMAIL.md are in place; an ephemeral run is
      # always dry. Same-day re-runs send nothing new (digest_sends). Fails the
      # job when any send fails, after recording why.
      - name: Digests
        if: always() && steps.secret.outputs.ready == 'true' && !inputs.backfill_days
        env:
          DATABASE_URL: ${{ env.DB_URL }}
          EMAIL_PROVIDER: ${{ vars.EMAIL_PROVIDER }}
          EMAIL_SEND_ENABLED: ${{ !inputs.ephemeral && vars.EMAIL_SEND_ENABLED || '' }}
          EMAIL_ALLOWLIST: ${{ vars.EMAIL_ALLOWLIST }}
          EMAIL_FROM: ${{ vars.EMAIL_FROM }}
          EMAIL_REPLY_TO: ${{ vars.EMAIL_REPLY_TO }}
          CONTACT_EMAIL: ${{ vars.CONTACT_EMAIL }}
          MAILING_ADDRESS: ${{ vars.MAILING_ADDRESS }}
          PUBLIC_BASE_URL: ${{ vars.PUBLIC_BASE_URL || 'https://permits-production-9581a3c0.up.railway.app' }}
          EMAIL_API_KEY: ${{ secrets.EMAIL_API_KEY }}
          LINK_SECRET: ${{ secrets.LINK_SECRET }}
          DIGEST_OUT_DIR: digest-preview
        run: set -o pipefail; node ingest/digest.js | tee -a "$GITHUB_STEP_SUMMARY"
      # Dry-run emails, to open in a browser. Private repo; kept 7 days.
      - name: Keep the rendered digests
        if: always() && hashFiles('digest-preview/*.html') != ''
        uses: actions/upload-artifact@v4
        with:
          name: digest-preview
          path: digest-preview/
          retention-days: 7
      # One-off after a trade-rule change (src/scoring.js): writes only rows
      # whose scores change, vacuuming between batches (Neon storage limit).
      - name: Re-score trades
        if: steps.secret.outputs.ready == 'true' && inputs.rescore
        env:
          DATABASE_URL: ${{ env.DB_URL }}
        run: set -o pipefail; node ingest/rescore.js | tee -a "$GITHUB_STEP_SUMMARY"
      # Superseded raw payloads past the retention window (ADR-14).
      - name: Raw retention
        if: steps.secret.outputs.ready == 'true' && !inputs.ephemeral
        env:
          DATABASE_URL: ${{ env.DB_URL }}
        run: node ingest/prune.js
      # Data-quality scorecard (ADR-23): today's value per market and metric,
      # with the day-30 and day-90 targets, into scorecard_snapshots.
      - name: Scorecard
        if: always() && steps.secret.outputs.ready == 'true'
        env:
          DATABASE_URL: ${{ env.DB_URL }}
        run: set -o pipefail; node ingest/scorecard.js | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Summary from sync_runs
        if: always() && steps.secret.outputs.ready == 'true'
        env:
          DATABASE_URL: ${{ env.DB_URL }}
        run: set -o pipefail; node ingest/summary.js | tee -a "$GITHUB_STEP_SUMMARY"
