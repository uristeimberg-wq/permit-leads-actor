name: sync

# Daily pilot sync (ADR-7): Austin and Miami-Dade into the hosted Postgres in
# the DATABASE_URL secret. Every attempt is recorded in sync_runs; --strict
# fails this job when any area fails, so GitHub notifies the repo owner.
on:
  schedule:
    # Austin finishes its daily reload around 15:30 UTC (measured 2026-11-13).
    - cron: '15 17 * * *'
  workflow_dispatch:
    inputs:
      ephemeral:
        description: Dry run against a throwaway Postgres in the job instead of DATABASE_URL
        type: boolean
        default: false
      backfill_days:
        description: Backfill instead of the daily windows, e.g. 180. Blank = normal daily sync
        type: string
        default: ''
      backfill_area:
        description: Area to backfill (austin-tx, austin-plan-review-tx, miami-dade-fl, miami-city-fl, raleigh-nc)
        type: string
        default: austin-tx
      rescore:
        description: Re-score every stored permit with the current trade rules (after a rule change)
        type: boolean
        default: false

concurrency:
  group: sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    # Only used by an ephemeral dry run; cheap to start otherwise.
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: permits
          POSTGRES_PASSWORD: permits
          POSTGRES_DB: permits
        ports: ['5433:5432']
        options: >-
          --health-cmd "pg_isready -U permits" --health-interval 5s
          --health-timeout 5s --health-retries 10
    env:
      DB_URL: ${{ inputs.ephemeral && 'postgres://permits:permits@localhost:5433/permits' || secrets.DATABASE_URL }}
    steps:
      - name: Check the database secret
        id: secret
        run: |
          if [ -z "$DB_URL" ]; then
            echo "::warning::DATABASE_URL secret is not set; no sync ran. Add it under Settings > Secrets and variables > Actions."
            echo "No sync ran: the DATABASE_URL secret is not set." >> "$GITHUB_STEP_SUMMARY"
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.secret.outputs.ready == 'true'
      - uses: actions/setup-node@v4
        if: steps.secret.outputs.ready == 'true'
        with:
          node-version: 20
          cache: npm
      - run: npm ci --ignore-scripts
        if: steps.secret.outputs.ready == 'true'
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
      # Applies pending migrations, then syncs the pilot areas. A failed run is
      # retried once after 10 minutes (every write is an upsert, so a re-run is
      # safe); both attempts are recorded in sync_runs (ADR-14).
      - name: Sync
        if: steps.secret.outputs.ready == 'true' && !inputs.backfill_days
        env:
          DATABASE_URL: ${{ env.DB_URL }}
          SOCRATA_APP_TOKEN: ${{ secrets.SOCRATA_APP_TOKEN }}
        run: |
          for attempt in 1 2; do
            node ingest/run.js --strict --kind=scheduled && exit 0
            if [ "$attempt" = 1 ]; then echo "::warning::Sync attempt 1 failed; retrying in 10 minutes"; sleep 600; fi
          done
          exit 1
      # One-off history pull for the GC relationships view. Inputs go through
      # env and are validated, never interpolated into the shell.
      - name: Backfill
        if: steps.secret.outputs.ready == 'true' && inputs.backfill_days
        env:
          DATABASE_URL: ${{ env.DB_URL }}
          SOCRATA_APP_TOKEN: ${{ secrets.SOCRATA_APP_TOKEN }}
          DAYS: ${{ inputs.backfill_days }}
          AREA: ${{ inputs.backfill_area }}
        run: |
          [[ "$DAYS" =~ ^[0-9]{1,4}$ ]] || { echo "::error::backfill_days must be a number"; exit 1; }
          [[ "$AREA" =~ ^(austin-tx|austin-plan-review-tx|miami-dade-fl|miami-city-fl|raleigh-nc)$ ]] || { echo "::error::unknown backfill_area"; exit 1; }
          node ingest/run.js --strict --kind=backfill --area="$AREA" --days="$DAYS"
      # Contractors, contact points and GC -> sub links, rebuilt from the
      # latest raw records (ADR-12). Runs even if one area failed, on what we have.
      - name: Resolve contractors
        if: always() && steps.secret.outputs.ready == 'true'
        env:
          DATABASE_URL: ${{ env.DB_URL }}
        run: node ingest/resolve.js
      # Lifecycle stages from the reviewed vocabularies, official dates, and the
      # Austin plan-review -> building-permit links (ADR-16). After the sync,
      # on what we have; prints unmapped statuses and the link rate.
      - name: Lifecycle and links
        if: always() && steps.secret.outputs.ready == 'true'
        env:
          DATABASE_URL: ${{ env.DB_URL }}
        run: set -o pipefail; node ingest/lifecycle.js | tee -a "$GITHUB_STEP_SUMMARY"
      # Who filed each Austin application, builder or permit expediter, from
      # the two organisation fields and the linked building permits (ADR-19).
      # After resolve and lifecycle: it reads contractors and permit_links.
      - name: Filers
        if: always() && steps.secret.outputs.ready == 'true'
        env:
          DATABASE_URL: ${{ env.DB_URL }}
        run: set -o pipefail; node ingest/filers.js | tee -a "$GITHUB_STEP_SUMMARY"
      # Property facts for permits whose source publishes a parcel id (ADR-14
      # step 3). After the sync so new permits are covered; runs even if one
      # area failed. Its own sync_runs row makes a failure visible to health.
      - name: Enrich parcels
        if: always() && steps.secret.outputs.ready == 'true'
        env:
          DATABASE_URL: ${{ env.DB_URL }}
        run: set -o pipefail; node ingest/enrich_parcels.js | tee -a "$GITHUB_STEP_SUMMARY"
      # Travis CAD property facts for Austin (ADR-15 step 3b; use rules in
      # docs/COMPLIANCE.md). Downloads a ~510 MB zip and streams it.
      - name: Enrich Travis CAD
        if: always() && steps.secret.outputs.ready == 'true'
        timeout-minutes: 30
        env:
          DATABASE_URL: ${{ env.DB_URL }}
        run: set -o pipefail; node ingest/enrich_tcad.js | tee -a "$GITHUB_STEP_SUMMARY"
      # Permit locations (ADR-15 item 4): source point, then parcel point, then
      # the Census geocoder on job-site addresses only. Runs after parcels.
      - name: Locate permits
        if: always() && steps.secret.outputs.ready == 'true'
        env:
          DATABASE_URL: ${{ env.DB_URL }}
        run: set -o pipefail; node ingest/geocode.js | tee -a "$GITHUB_STEP_SUMMARY"
      # State licence registries (ADR-15 item 1): verifies contractors after
      # Resolve has rebuilt them. Each provider records its own sync run.
      - name: Verify licences
        if: always() && steps.secret.outputs.ready == 'true'
        env:
          DATABASE_URL: ${{ env.DB_URL }}
          SOCRATA_APP_TOKEN: ${{ secrets.SOCRATA_APP_TOKEN }}
        run: set -o pipefail; node ingest/enrich_licences.js | tee -a "$GITHUB_STEP_SUMMARY"
      # One-off after a trade-rule change (src/scoring.js): writes only rows
      # whose scores change, vacuuming between batches (Neon storage limit).
      - name: Re-score trades
        if: steps.secret.outputs.ready == 'true' && inputs.rescore
        env:
          DATABASE_URL: ${{ env.DB_URL }}
        run: set -o pipefail; node ingest/rescore.js | tee -a "$GITHUB_STEP_SUMMARY"
      # Superseded raw payloads past the retention window (ADR-14).
      - name: Raw retention
        if: steps.secret.outputs.ready == 'true' && !inputs.ephemeral
        env:
          DATABASE_URL: ${{ env.DB_URL }}
        run: node ingest/prune.js
      - name: Summary from sync_runs
        if: always() && steps.secret.outputs.ready == 'true'
        env:
          DATABASE_URL: ${{ env.DB_URL }}
        run: set -o pipefail; node ingest/summary.js | tee -a "$GITHUB_STEP_SUMMARY"
