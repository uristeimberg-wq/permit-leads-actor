<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>New permits · Contractos</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo+Narrow:wght@500&amp;family=Archivo:wght@400;700&amp;family=Oswald:wght@700&amp;display=swap" rel="stylesheet">
<link rel="stylesheet" href="live.css">
<link rel="stylesheet" href="tour.css">
</head>
<body>
<div id="top"></div>
<main class="narrow">
  <div class="head">
    <div>
      <h1 id="title">New permits</h1>
      <span class="context" id="eyebrow">New building permits</span>
      <p class="lede" id="lede">Loading…</p>
    </div>
  </div>
  <form class="filters" id="filters">
    <label>Area <select name="source"></select></label>
    <label>No permit on record for <select name="without"><option value="">(any: list all)</option><option value="electrical">Electrical</option><option value="plumbing">Plumbing</option><option value="mechanical">Mechanical</option></select></label>
    <label>First seen in <select name="days"><option value="7">last 7 days</option><option value="14">last 14 days</option><option value="30">last 30 days</option></select></label>
    <label>ZIPs <input name="zips" placeholder="all" size="14"></label>
    <label>Min value $ <input name="minValuation" placeholder="any" size="8" inputmode="numeric"></label>
    <button type="submit">Apply</button>
  </form>
  <div id="list"><div class="state">Loading…</div></div>
  <div id="foot"></div>
</main>
<script src="../../links.js"></script>
<script src="live.js"></script>
<script src="tour.js"></script>
<script>
(function () {
  const L = window.Live;
  const p = L.params();
  const f = { source: L.areaOf(p.source), without: p.without || '', days: p.days || '7', zips: p.zips || '', minValuation: p.minValuation || '' };
  const form = document.getElementById('filters');
  form.elements.source.innerHTML = L.areaOptions(f.source);
  for (const k of Object.keys(f)) form.elements[k].value = f[k];
  form.addEventListener('submit', (e) => { e.preventDefault(); location.search = L.qs(Object.fromEntries(new FormData(form))); });
  document.getElementById('top').innerHTML = L.topBar();

  L.api(`/api/pilot/leads?${L.qs(f)}`).then(render).catch((e) => L.fail(document.getElementById('list'), e));

  function render(d) {
    if (d.jobLinksHidden) {
      document.getElementById('title').textContent = `New building permits, ${L.AREA[f.source]}`;
      document.getElementById('lede').textContent = d.jobLinksHidden;
      document.getElementById('list').innerHTML = '';
      return;
    }
    const n = d.leads.length;
    const w = d.without;
    document.getElementById('eyebrow').textContent = `New building permits · ${L.AREA[f.source]}`;
    document.getElementById('title').textContent = `${n} new building permit${n === 1 ? '' : 's'}${w ? ` with no ${w} permit on record` : ''}, ${L.AREA[f.source]}`;
    document.getElementById('lede').innerHTML = `Building permits we first saw in the last ${d.days} days${w ? `, on jobs with no ${L.esc(w)} permit issued yet` : ''}, newest issue date first. The contractor shown is the one named on the permit.`
      + `<br><span class="sub">Data as of ${L.esc(L.dateTime(d.meta && d.meta.lastSyncAt))}. ${L.esc(d.meta && d.meta.publicationLag)}.${w ? ` No ${L.esc(w)} permit on record says nothing about whether anyone is hired.` : ''}</span>`;
    const list = document.getElementById('list');
    list.innerHTML = n ? d.leads.map((l, i) => `
      <article class="card lead">
        <div class="lead-row">
          <div><span class="mono sub">${String(i + 1).padStart(2, '0')}</span> <strong>${L.esc(l.address || 'Address not published')}</strong>${l.zip && !String(l.address || '').includes(l.zip) ? `, ${L.esc(l.zip)}` : ''}
            <div class="sub">${L.esc(l.permit_type || '')} · ${l.filed_date ? `issued ${L.esc(L.date(l.filed_date))}` : 'not issued yet'} · ${L.esc(L.money(l.valuation))} · ${L.esc(l.status_raw || 'status unknown')}</div></div>
          ${'score' in l ? `<div class="mono sub" title="Trade fit score from the description's wording">fit ${l.score == null ? '—' : l.score}</div>` : ''}
        </div>
        <p class="body-sm">${L.esc((l.work_description || '').slice(0, 220))}${(l.work_description || '').length > 220 ? '…' : ''}</p>
        <div class="lead-row lead-row--mid">
          <div>${L.who(l.gc)} <span class="sub">· contractor on the building permit</span></div>
          <div>${l.gc && l.gc.name ? L.phoneCell(l.gc.phone) : ''}</div>
        </div>
        <p class="note"><a href="job.html?${L.qs({ id: l.id })}">Open permit</a> · permit <span class="mono">${L.esc(l.permit_number)}</span></p>
      </article>`).join('') : '<div class="card state">No new building permits in this window for these filters.</div>';
    document.getElementById('foot').innerHTML = L.attribution(d.meta);
  }
}());
</script>
</body>
</html>
