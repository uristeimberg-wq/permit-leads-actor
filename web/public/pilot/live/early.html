<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Early filings · Contractos</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo+Narrow:wght@500&amp;family=Archivo:wght@400;700&amp;family=Oswald:wght@700&amp;display=swap" rel="stylesheet">
<link rel="stylesheet" href="live.css">
</head>
<body>
<div id="top"></div>
<main>
  <div class="head">
    <div>
      <h1 id="title">Early filings</h1>
      <span class="context" id="eyebrow">Before the permit is issued</span>
      <p class="lede" id="lede">Loading…</p>
    </div>
  </div>
  <form class="filters" id="filters">
    <label>Area <select name="source"></select></label>
    <label>Submitted in <select name="days"><option value="7">last 7 days</option><option value="14">last 14 days</option><option value="30">last 30 days</option><option value="90">last 90 days</option></select></label>
    <label>Show <select name="segment"><option value="homes">New homes</option><option value="apartments">New apartments (5+ units)</option><option value="commercial">New commercial buildings</option><option value="all">All filings</option></select></label>
    <label>ZIPs <input name="zips" placeholder="all" size="14"></label>
    <button type="submit">Apply</button>
  </form>
  <div id="counts"></div>
  <div id="list"><div class="state">Loading…</div></div>
  <div id="foot"></div>
</main>
<script src="../../links.js"></script>
<script src="live.js"></script>
<script>
// Filings not issued yet (ADR-16): Austin plan-review cases and Raleigh's
// pre-issue rows. Dates shown are the source's own beside when we first saw
// the filing. Third-party text goes through esc() (CLAUDE.md rule 8).
// "Filed by" is the business on the application (ADR-19): a builder or a
// permit expediter, with the evidence on hover. Owners and person-looking
// names are never shown (rule 5). A builder's past subs are history from
// issued permits, not a claim about this job.
(function () {
  const L = window.Live;
  const p = L.params();
  const f = { source: L.areaOf(p.source), days: p.days || '30', segment: p.segment == null ? 'homes' : p.segment, zips: p.zips || '' };
  const form = document.getElementById('filters');
  form.elements.source.innerHTML = L.areaOptions(f.source);
  for (const k of Object.keys(f)) form.elements[k].value = f[k];
  form.addEventListener('submit', (e) => { e.preventDefault(); location.search = L.qs(Object.fromEntries(new FormData(form))); });
  document.getElementById('top').innerHTML = L.topBar('early.html');
  const $ = (id) => document.getElementById(id);
  const SEGMENT = { homes: 'new homes', apartments: 'new apartment buildings', commercial: 'new commercial buildings' };
  const ROLE = { builder: ['Builder', 'ok'], expediter: ['Permit expediter', 'warn'], unknown: ['Filed by', ''] };
  const TRADE = { electrical: 'Electrical', mechanical: 'HVAC', plumbing: 'Plumbing' };
  const STAGE = { pre_application: 'Pre-application', submitted: 'Submitted', in_review: 'In review', corrections: 'Corrections requested', approved: 'Approved, not issued' };

  L.api(`/api/pilot/early?${L.qs(f)}`).then(render).catch((e) => L.fail($('list'), e));

  function render(d) {
    const area = L.AREA[f.source];
    $('title').textContent = `Early filings in ${area}`;
    if (!d.available) {
      $('lede').innerHTML = `${L.esc(area)} publishes issued permits only, so there is nothing to list before issue. Austin and Raleigh publish filings while they are still in review.`;
      $('list').innerHTML = '';
      $('foot').innerHTML = L.attribution(d.meta);
      return;
    }
    if (!d.segmentable) form.elements.segment.closest('label').hidden = true;
    const n = d.filings.length;
    const total = d.counts.reduce((a, c) => a + c.n, 0);
    const what = d.segment ? `applications for ${SEGMENT[d.segment]}` : 'filings';
    const sc = d.segmentCounts;
    $('lede').innerHTML = `${total.toLocaleString('en-US')} ${what} submitted in the last ${d.days} days are not issued yet${n < total ? `; the newest ${n} are listed` : ''}.
      ${sc ? `<br><span class="sub">In the same window: new homes ${sc.homes.toLocaleString('en-US')} · apartments ${sc.apartments.toLocaleString('en-US')} · commercial ${sc.commercial.toLocaleString('en-US')}.</span>` : ''}
      <br><span class="sub">${d.sources.map((s) => `${L.esc(s.label)}: last sync ${L.esc(L.dateTime(s.lastSyncAt))}${s.lastSyncStatus === 'failed' ? ' (latest attempt failed)' : ''}`).join(' · ')}.
      ${L.esc((d.meta && d.meta.earlyLag) || '')}. Austin's applications name no contractor yet. We show the business that filed when its name is a business; owners and people's names are never shown.</span>
      ${d.segment === 'apartments' || d.segment === 'commercial' ? `<br><span class="sub">Context: in Austin 2020-2024, ${d.segment === 'apartments' ? '92%' : '80%'} of these buildings had a site plan on file a median of about a year before this application. Site plans are not on this list yet.</span>` : ''}`;
    $('counts').innerHTML = `<p class="sub">${d.counts.map((c) => `${L.esc(STAGE[c.stage] || c.stage)} ${c.n.toLocaleString('en-US')}`).join(' · ')}</p>`;
    $('list').innerHTML = n ? `<div class="card"><table><thead><tr><th>Submitted</th><th>Stage</th><th>Likely issued</th><th>Address</th><th class="hide-sm">Type</th><th class="n hide-sm">Declared value</th><th>Filed by</th><th>Builder's past subs</th><th class="hide-sm">Filing</th></tr></thead><tbody>
      ${d.filings.map((r) => {
        const url = window.safeHttpUrl(r.permit_url);
        const num = url ? `<a class="mono" href="${L.esc(url)}" rel="noopener noreferrer" target="_blank">${L.esc(r.permit_number)}</a>` : `<span class="mono">${L.esc(r.permit_number)}</span>`;
        const seen = `First seen by us ${L.date(r.first_seen_at)}${r.firstSeenStage ? `, while ${(STAGE[r.firstSeenStage] || r.firstSeenStage).toLowerCase()}` : ''}`;
        return `<tr>
          <td class="mono"><span class="prov" title="${L.esc(seen)}">${L.esc(r.submittedOn ? L.date(r.submittedOn) : 'not published')}</span></td>
          <td>${L.esc(STAGE[r.stage] || r.stage)}${r.stageSince ? `<div class="sub">since ${L.esc(L.date(r.stageSince))}</div>` : ''}${r.issuedPermitId ? `<div><a href="job.html?${L.qs({ id: r.issuedPermitId })}">permit issued</a></div>` : ''}</td>
          <td>${forecastCell(r)}</td>
          <td>${L.esc(r.address || 'Address not published')}${r.zip && !String(r.address || '').includes(r.zip) ? `, ${L.esc(r.zip)}` : ''}<div class="sub">${L.esc((r.work_description || '').slice(0, 140))}${(r.work_description || '').length > 140 ? '…' : ''}</div></td>
          <td class="hide-sm">${L.esc(r.permit_type || '')}</td>
          <td class="n mono hide-sm">${L.esc(L.money(r.valuation))}</td>
          <td>${r.contractor ? `${L.who(r.contractor)}${r.contractor.name ? `<div>${L.phoneCell(r.contractor.phone)}</div>` : ''}` : filerCell(r)}</td>
          <td>${subsCell(r)}</td>
          <td class="hide-sm">${num}</td></tr>`;
      }).join('')}</tbody></table></div>` : '<div class="card state">No filings in review in this window.</div>';
    $('foot').innerHTML = L.attribution(d.sources[0] || d.meta)
      + `<p class="note">"Filed by" comes from the application's organisation fields. A builder is a business that pulled most of the building permits its earlier applications led to, or that is the contractor on Austin building permits we hold; a permit expediter says so in its name or files for many contractors. Anything else is shown without a role. Hover a name for the evidence.</p>`
      + `<p class="note">Past subs are the electrical, plumbing and HVAC contractors on that builder's earlier issued permits. The subs for this job are not known until its trade permits are filed.</p>`
      + `<p class="note"><span class="pill est">estimate</span> "Likely issued" is our estimate, not a date the city has given. It comes from building permits issued in ${L.esc(L.AREA[f.source])} in the last 12 months, measured from the city's application date to its issue date: the same census class where there are 20 or more, else the same kind of building, else every building permit. Only permits that were still open at this filing's age are compared, and the range is where the middle 6 in 10 of them landed. It assumes the filing is issued at all, and it does not read the review stage. Tap or hover a range for its basis.</p>`
      + `<p class="note">"Submitted" is the city's own application date; hover it for when we first saw the filing. Stages come from each city's status wording, mapped in reviewed code; a status we have not mapped is left out of this list rather than guessed.</p>`;
  }

  const BASIS = { class: (b) => `building permits for ${b.label || 'this class'}`, segment: (b) => `${b.label || 'similar'} building permits`, all: () => 'all building permits (too few of this class)' };
  function forecastCell(r) {
    const fc = r.issueForecast;
    if (r.issuedPermitId) return '<span class="sub">issued</span>';
    if (!fc || fc.status === 'no_date') return '<span class="sub">no application date</span>';
    const what = fc.basis ? (BASIS[fc.basis.basis] || BASIS.all)(fc.basis) : 'comparable permits';
    if (fc.status === 'thin') return `<span class="sub prov" title="${L.esc(`Only ${fc.n} comparable permits issued in the last 12 months; at least 20 are needed for an estimate.`)}">not enough history</span>`;
    if (fc.status === 'overdue') {
      return `<span class="sub prov" title="${L.esc(`${fc.ageDays} days since application. ${L.pct(fc.pastShare)} of ${fc.n} ${what} issued in the last 12 months took less time, so there are too few still-open cases to estimate from.`)}">longer than ${L.esc(L.pct(fc.pastShare))} of similar cases</span>`;
    }
    const why = `Estimate. ${fc.nAtAge} of ${fc.n} ${what} issued in the last 12 months were still open ${fc.ageDays} days after application; the middle 6 in 10 of them were issued between ${L.date(fc.lowOn)} and ${L.date(fc.highOn)} counted from today, median ${L.date(fc.midOn)}. Typical time from application to issue: ${fc.typicalDays} days.`;
    return `<span class="prov" title="${L.esc(why)}">${L.esc(L.dateRange(fc.lowOn, fc.highOn))}</span> ${L.estPill(why)}<div class="sub">median ${L.esc(L.shortDate(fc.midOn))}</div>`;
  }

  function filerCell(r) {
    if (r.filer) {
      const [label, cls] = ROLE[r.filer.role] || ROLE.unknown;
      const why = `${r.filer.basis}. Named on ${r.filer.filings} application(s) we hold. From raw record ${r.filer.rawRecordId}.`;
      const name = r.filer.contractorId && r.filer.role === 'builder'
        ? `<a href="contractor.html?${L.qs({ id: r.filer.contractorId })}">${L.esc(r.filer.name)}</a>` : L.esc(r.filer.name);
      return `${label && r.filer.role !== 'unknown' ? `<span class="pill ${cls}">${L.esc(label)}</span>` : ''}<span class="prov" title="${L.esc(why)}">${name}</span>`;
    }
    if (r.filerWithheld) return '<span class="sub prov" title="The name on the application looks like a person, so it is withheld (ADR-10)">Withheld</span>';
    return '<span class="sub">not named</span>';
  }

  function subsCell(r) {
    if (!r.filer || r.filer.role !== 'builder') return '<span class="sub">—</span>';
    if (!r.builderSubs.length) return '<span class="sub">no trade permits on record</span>';
    const byTrade = {};
    for (const s of r.builderSubs) (byTrade[s.trade] ||= []).push(s);
    return Object.entries(byTrade).map(([t, list]) => `<div><span class="sub">${L.esc(TRADE[t] || t)}:</span> ${list.map((s) =>
      `<span class="prov" title="${L.esc(`${s.jobs} of this builder's ${s.tradeJobs} ${TRADE[t] || t} jobs on record; latest ${L.date(s.lastJobOn)}`)}">${s.sub && s.sub.name ? L.who(s.sub) : 'Individual (withheld)'}</span> <span class="sub mono">${s.jobs}</span>`).join(', ')}</div>`).join('');
  }
}());
</script>
</body>
</html>
