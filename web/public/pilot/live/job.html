<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Lead · Contractos</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo+Narrow:wght@500&amp;family=Archivo:wght@400;700&amp;family=Oswald:wght@700&amp;display=swap" rel="stylesheet">
<link rel="stylesheet" href="live.css">
</head>
<body>
<div id="top"></div>
<main id="main"><div class="state">Loading…</div></main>
<script src="../../links.js"></script>
<script src="live.js"></script>
<script>
(function () {
  const L = window.Live;
  const p = L.params();
  const trade = ['electrical', 'plumbing', 'mechanical'].includes(p.trade) ? p.trade : 'electrical';
  document.getElementById('top').innerHTML = L.topBar();
  const main = document.getElementById('main');
  if (!/^\d+$/.test(p.id || '')) { L.fail(main, new Error('No permit given')); return; }

  L.api(`/api/pilot/jobs/${p.id}?${L.qs({ trade })}`).then(render).catch((e) => L.fail(main, e));

  // Hover text saying where a value came from (rule 6).
  const prov = (d, field) => d.provenance
    ? `From ${d.permit.permit_number}, field ${field}, raw record ${d.provenance.rawRecordId}, fetched ${L.dateTime(d.provenance.fetchedAt)} (sync run ${d.provenance.syncRunId})`
    : 'Provenance not recorded for this permit';
  const val = (d, field, html) => `<span class="prov" title="${L.esc(prov(d, field))}">${html}</span>`;

  // Where the map point came from, and how sure it is (rule 6). A Census
  // point is an estimate along the street, so it never reads as exact.
  const METHOD = {
    source: 'Map point published with the permit',
    parcel: 'Map point of the appraiser parcel',
    census: 'Map point estimated from the address (US Census geocoder)',
  };
  function place(loc) {
    if (!loc) return '<p class="sub">No map point: the address could not be placed.</p>';
    const ll = `${Number(loc.lat).toFixed(5)}, ${Number(loc.lng).toFixed(5)}`;
    const osm = `https://www.openstreetmap.org/?mlat=${Number(loc.lat)}&mlon=${Number(loc.lng)}#map=18/${Number(loc.lat)}/${Number(loc.lng)}`;
    const how = [loc.provenance.matchedAddress ? `Census read it as ${loc.provenance.matchedAddress}` : '',
      `located ${L.dateTime(loc.provenance.locatedAt)}`, loc.provenance.attribution || ''].filter(Boolean).join('. ');
    return `<p class="sub">${loc.approximate ? '<span class="pill">approximate</span> ' : ''}<span class="prov" title="${L.esc(how)}">${L.esc(METHOD[loc.method] || loc.method)}</span>
      · <a class="mono" href="${L.esc(osm)}" rel="noopener noreferrer" target="_blank">${L.esc(ll)}</a>
      ${loc.method === 'census' ? `<br>${L.esc(loc.provenance.attribution || '')}` : ''}</p>`;
  }

  // How the job got here (ADR-16): the application behind the permit, with the
  // source's own dates beside the day we first saw each filing.
  const STAGE = { pre_application: 'Pre-application', submitted: 'Submitted', in_review: 'In review', corrections: 'Corrections',
    approved: 'Approved, not issued', issued: 'Issued', inspections: 'Inspections', completed: 'Completed', expired: 'Expired',
    withdrawn: 'Withdrawn', cancelled: 'Cancelled', denied: 'Denied', unknown: 'Stage not mapped' };
  function lifecycleCard(lc) {
    if (!lc) return '';
    const hist = (h) => h.length ? `<ol class="sub">${h.map((x) => `<li>${L.esc(x.status || 'no status')} · ${L.esc(x.stage ? STAGE[x.stage] || x.stage : 'stage not recorded')}${x.stageSince ? ` · source date ${L.esc(L.date(x.stageSince))}` : ''} · seen ${L.esc(L.date(x.observedAt))}</li>`).join('')}</ol>` : '';
    const apps = (lc.applications || []).map((a) => {
      const url = window.safeHttpUrl ? window.safeHttpUrl(a.url) : null;
      return `<div><p><strong>Application ${url ? `<a class="mono" href="${L.esc(url)}" rel="noopener noreferrer" target="_blank">${L.esc(a.permitNumber)}</a>` : `<span class="mono">${L.esc(a.permitNumber)}</span>`}</strong>
        · ${L.esc(STAGE[a.stage] || a.stage)}</p>
        <p class="sub">Submitted ${L.esc(a.submittedOn ? L.date(a.submittedOn) : 'date not published')} (the city's date) · first seen by us ${L.esc(L.date(a.firstSeenAt))}${a.firstSeenStage ? ` while ${L.esc((STAGE[a.firstSeenStage] || a.firstSeenStage).toLowerCase())}` : ''}.
        Linked by ${L.esc(a.link && a.link.detail)} (the city's own reference).</p>${hist(a.history || [])}</div>`;
    }).join('');
    return `<div class="card"><h2>How this job started</h2>
      ${apps || '<p class="sub">No earlier application on file for this permit.</p>'}
      <p class="sub">This permit: ${L.esc(STAGE[lc.stage] || lc.stage)}${lc.submittedOn ? `, applied ${L.esc(L.date(lc.submittedOn))}` : ''}.</p>${hist(lc.history || [])}</div>`;
  }

  function render(d) {
    const pm = d.permit;
    document.title = `${pm.permit_number} · ${L.TRADE[trade]} lead`;
    const age = L.daysSince(pm.filed_date);
    const tradeRows = ['electrical', 'plumbing', 'mechanical'].map((t) => {
      const got = d.related.filter((r) => r.trade === t);
      if (!got.length) return `<tr><td>${L.TRADE[t]}</td><td class="sub">none issued yet</td><td>—</td><td>${t === trade ? '<span class="pill">your trade</span>' : '—'}</td></tr>`;
      return got.map((r) => `<tr><td>${L.TRADE[t]}</td><td class="mono"><a href="job.html?${L.qs({ id: r.id, trade })}">${L.esc(r.permit_number)}</a></td><td class="mono">${L.esc(L.date(r.issuedOn))}</td><td>${L.who(r.contractor)}</td></tr>`).join('');
    }).join('');
    const others = d.related.filter((r) => !r.trade);
    const h = d.gcHiring;

    main.innerHTML = `
    <div class="head">
      <div>
        <h1>${L.esc(pm.permit_type || 'Permit')}${pm.city ? ` · ${L.esc(pm.city)}` : ''}</h1>
        <span class="context">${L.esc(L.TRADE[trade])} · ${L.esc(L.AREA[pm.source_area] || pm.source_area)} · ${d.isBuilding ? 'building permit' : 'permit'}</span>
        <p class="lede">${val(d, 'address', L.esc(pm.address || 'Address not published'))}${pm.zip && !String(pm.address || '').includes(pm.zip) ? ` ${L.esc(pm.zip)}` : ''}</p>
        ${place(d.location)}
        <p class="lede"><strong>${d.tradePermitIssued ? `A ${L.esc(trade)} permit has been issued on this job.` : `No ${L.esc(trade)} permit issued on this job yet.`}</strong>
          <span class="sub">${d.tradePermitIssued ? '' : (d.meta && (d.meta.earlySources || []).includes(d.meta.source) ? 'None is on file yet, issued or in review; a sub may still be lined up.' : 'The source lists issued permits only, so one may be in review, and a sub may already be lined up.')}</span></p>
      </div>
      ${L.freshness(d.meta)}
    </div>

    <div class="grid2">
      <div class="card">
        <h2>Building permit</h2>
        <dl class="kv">
          <dt>Permit</dt><dd class="mono">${val(d, 'permit_number', L.esc(pm.permit_number))}${window.safeHttpUrl(pm.permit_url) ? ` · <a href="${L.esc(window.safeHttpUrl(pm.permit_url))}" rel="noopener noreferrer" target="_blank">view at source</a>` : ''}</dd>
          <dt>Status</dt><dd>${val(d, 'status', L.esc(pm.status_raw || 'unknown'))} <span class="sub">(${L.esc(pm.status_stage || 'unknown')})</span></dd>
          <dt>Issued</dt><dd>${val(d, 'issue date', L.esc(L.date(pm.filed_date)))}${age != null ? ` <span class="sub">· ${age} days ago</span>` : ''}</dd>
          <dt>Declared value</dt><dd>${val(d, 'valuation', L.esc(L.money(pm.valuation)))}</dd>
          <dt>First seen by us</dt><dd>${L.esc(L.dateTime(pm.first_seen_at))}</dd>
          <dt>Trade fit score</dt><dd class="mono">${pm.trade_scores && pm.trade_scores[trade === 'mechanical' ? 'hvac' : trade] != null ? pm.trade_scores[trade === 'mechanical' ? 'hvac' : trade] : '—'} <span class="sub">from the description's wording</span></dd>
        </dl>
        <h2 class="h-gap">Description, as filed</h2>
        <div class="desc">${L.esc(pm.work_description || 'No description published')}</div>
      </div>

      <div class="card call">
        <h2>Who to call</h2>
        ${d.gc && d.gc.name ? `
          <div class="who-big">${L.who(d.gc)}</div>
          <div class="sub">Contractor on the building permit${d.match ? ` · matched by ${L.esc(d.match.rule === 'licence' ? 'licence number' : 'exact name within the state')}` : ''}</div>
          <div class="who-phone">${L.phoneCell(d.gc.phone)}</div>
          <p class="note">Tap or hover the label next to the number for where it came from. "Corroborated" means it is on 3+ of this company's permits and no other company's. Nobody has called to check it.</p>
          ${d.gcRegistry && d.gcRegistry.length ? `<h2 class="h-gap">State licence</h2>${L.registryList(d.gcRegistry, { compact: true })}` : ''}`
        : d.gc ? `<p>${L.who(d.gc)}</p><p class="note">${L.esc(d.gc.withheld)}</p>` : '<p class="sub">No contractor on this permit (owner-builder or not published).</p>'}
        ${h ? `<h2 class="h-gap">How this GC hires ${L.esc(L.TRADE_PERSON[trade])}</h2>
          <p class="body-sm">${h.buildingJobs} building jobs in our data, latest ${L.esc(L.date(h.lastJobOn))}.
          ${h.subsUsed ? `Used ${h.subsUsed} ${L.esc(L.TRADE_PERSON[trade])}; the top one on ${L.pct(h.topSubShare)} of linked jobs.` : `No ${L.esc(trade)} hires linked yet.`}</p>
          ${h.subs.length ? `<table><tbody>${h.subs.map((s) => `<tr><td>${L.who(s.sub)}</td><td class="n mono">${s.jobs} job${s.jobs === 1 ? '' : 's'}</td></tr>`).join('')}</tbody></table>` : ''}
          <p class="note"><a href="gcs.html?${L.qs({ source: pm.source_area, trade })}">All GCs in ${L.esc(L.AREA[pm.source_area] || '')}</a></p>` : ''}
      </div>
    </div>

    <div class="grid2">
    ${L.propertyCard(d.property, pm.source_area)}
    <div class="card">
      <h2>Trade permits on this job</h2>
      <table><thead><tr><th>Trade</th><th>Permit</th><th>Issued</th><th>Pulled by</th></tr></thead><tbody>${tradeRows}</tbody></table>
      ${others.length ? `<p class="note">Also on this job: ${others.map((r) => `<a class="mono" href="job.html?${L.qs({ id: r.id, trade })}">${L.esc(r.permit_number)}</a>`).join(', ')}</p>` : ''}
      <p class="note">Linked by ${L.esc((d.meta && d.meta.jobLink) || 'permit number')}.${d.meta && d.meta.source === 'austin-tx' ? ' Austin creates trade permits with the building permit, so issue dates, not application dates, are what tell trades apart here.' : ''}</p>
    </div>
    ${lifecycleCard(d.lifecycle)}
    </div>
    ${L.attribution(d.meta)}`;
  }
}());
</script>
</body>
</html>
